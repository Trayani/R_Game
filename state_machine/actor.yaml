
# CONFIG
CFG_PP_RELEASE AT: float  # range 0..1  , default: 0.6

## STATES
MOVE:
  - DO: move_to_target
  - SET NDT: distance_to_target
  - SET PD: distance_to_point(actor.pos)
  - PROC:switch_pp:
      SET NEXT: actor.reserved_point
      IF NEXT < 0:
        SET NEXT: actor.reserved_anchor
        RECHECK:                                # RECHECK means evaluate again the 'NEXT < 0' condition
          SET actor.pp_switched: true
          RETURN: PASS                          # PASS is void

      IF (actor.reserved_anchor >=0)  && distance_to_point(actor.reserved_point) > distance_to_point(actor.reserved_anchor):
        SET NEXT: actor.reserved_anchor
        SET actor.reserved_anchor: -1     # -1 means 'invalid'
      ELSE:
        SET actor.reserved_point: -1      # -1 means 'invalid'
      SET actor.pp_switched: true
      DO: release_reserved(actor.ppId)
      SET actor.ppId: NEXT
      SET actor.pp: to_point(NEXT)

    # PP switch
  - SET TOTAL: PD.x + NDT.x  + PD.y + NDT.y
  - IF AND(!actor.pp_switched, OR((TOTAL == 0),  (PD.x + PD.y) / TOTAL) > CFG_PP_RELEASE):              # if CFG_PP_RELEASE=0.6, then PP switch happens after 60% of the distance was walked
      DO: switch_pp


  - IF AND(NDT.x < 0.5 ,  NDT.y < 0.5):
      - IF !pp_switched:
          DO: switch_pp
      - DO: release_reserved(actor.reserved_point,  actor.reserved_anchor)
      - SET state: IDLE


IDLE:
  - IF actor.dest.x < 0  || actor.dest.y < 0: PASS                # PASS means terminate early
  - SET d: opt_dir
  - SET actor.dir: optimal_direction(d)
  - IF !actor.dir.set:
      IF d.cardinality == V:
        alternative_direction( DT(N, d.south, false), DT(N, d.south, true))
      ELSE IF d.cardinality == H:
        alternative_direction( DT(N, false,  d.east), DT(N, true,  d.east))
      ELSE:
        alternative_direction( DT(V, d.south,  false), DT(H, false,  d.east))
  - IF actor.dir.set:
      SET actor.pp_switched: false
      SET state: MOVE
    ELSE:
      DO: wait_frames(3)

## TYPES
DirectionTypeCardinality: H | V | N   # horizontal | vertical | none

DirectionType:
  fields:
    cardinality: DirectionTypeCardinality
    south: bool
    east: bool
  const:
    - NORTH(V, false, false)
    - SOUTH(V, true, false)
    - EAST(H, false, true)
    - WEST(H, false, false)
    - NORTH_WEST(N, false, false)
    - NORTH_EAST(N, false, true)
    - SOUTH_WEST(N, true, false)
    - SOUTH_EAST(N, true, true)
  alias: DT

f2: float x, float y
f2n: float x, float y, bool set
i2: int x, int y
i2n: int x, int y, bool set
Direction: DT type, bool direct, bool set, f2 target

Actor:
  pos: f2     # float-precise position of the actor in the grid
  pp: i2n     # primary point (also called subPoint) that denotes the actor's normalized position (for the purpose of path finding and crowd control)
  ppId: int32 # ID of the primary point, calculated as  pp.x + pp.y * grid_columns
  dest: i2   # int-point of the destination that the actor should move to
  dir: Direction  # categorization of the actor's direction of motion
  speed: float   # motion speed
  reserved_point: int = -1  # ID of a reserved point, that the actor is approaching
  reserved_anchor: int = -1  #  ID of a secondary reserved point
  pp_switched: bool = false




## PROCEDURES
proc:
  opt_dir:DirectionType:
    - SET south: actor.pp.y < actor.dest.y
    - IF actor.pp.x == actor.dest.x: RETURN  (V, south, false)
    - SET east: actor.pp.x < actor.dest.x
    - IF actor.pp.y == actor.dest.y: RETURN  (H, false, east)
    - RETURN: (N, south, east)

  to_pos(int pointId):f2:
    SET y: pointId / grid_columns     #(this should round down)
    RETURN: (pointId - y*grid_columns)*grid_cell_width, y*grid_cell_height
  to_pos(int2 point):f2:
    RETURN: point.x*grid_cell_width, point.y*grid_cell_height
  to_point(int pointId):i2:
    SET y: pointId / grid_columns     #(this should round down)
    RETURN: (pointId - y*grid_columns), y


  alternative_direction(DT a, DT b):
      - SET actor.dir: optimal_direction(a)
      - IF !actor.dir.set:
          - SET actor.dir: optimal_direction(b)

  optimal_direction(DT d):Direction:
    - SET h_offset: (if d.east 1 else -1)
    - SET v_offset: (if d.south 1 else -1)
    - SET anchor_h_id: actor.ppId + h_offset
    - SET anchor_v_id: actor.ppId + v_offset*grid_columns
    - IF d.cardinality == V:
        RETURN:  ( d, false, try_reserve_point( anchor_v_id), to_pos(anchor_v_id) )

    - IF d.cardinality == H:
        RETURN: ( d, false, try_reserve_point( anchor_h_id), to_pos(anchor_h_id))

    - SET diagonal_id: actor.ppId + h_offset + v_offset*grid_columns
    - SET diagonal: can_reserve_point(diagonal_id)
    - IF !diagonal:
        RETURN: ( d, false,  false, (0,0) )         #  'default'  is the "zero" state (false/zero/null values)
    - SET anchor_h: can_reserve_point( anchor_h_id)
    - SET anchor_v: can_reserve_point( anchor_v_id)
    - IF AND(!anchor_h , !anchor_v):
        RETURN: ( d, false,  false, (0,0) )
    - SET affinity_h: abs(actor.dest.x - actor.pp.x) > abs(actor.dest.y - actor.pp.y)
    - SET DEST_POS: to_pos(actor.dest)
    - SET RECT_X: (actor.pp.x+h_offset) * grid_cell_width
    - SET RECT_Y: (actor.pp.y+v_offset) * grid_cell_height
    - IF affinity_h:
        - SET xDiff: DEST_POS.x - actor.pos.x
        - IF AND( anchor_h, xDiff != 0):
            - SET SLOPE:  (DEST_POS.y - actor.pos.y) / xDiff         # line equation, please validate correctness
            - SET TARGET_Y: SLOPE * (RECT_X - actor.pos.x) + actor.pos.y
            # RECT_X and RECT_Y  are float coordinates of a rectangle edge that is diagonally opposite to the actor's POINT-based position (actor.pp)
            # The rectangle forms an area of possible movement. Since the horizontal direction is stronger than
            # vertical, we already know, that the actor must travel to the vertical boundary at RECT_X.
            # But Y must be calculated by line equation based on actor's actual position (actor.pos).
            # That can lead to edge cases, where the projected Y is outside the rectangle.
            # Thus, we have to clamp it: if the vertical direction is
            # - south: Y should increment toward destination, so we clamp:
            #   - Lower bound: actor.pos.y (cannot move backward/north)
            #   - Upper bound: RECT_Y (cannot aim beyond rectangle)
            #   - Formula: max(min(TARGET_Y, RECT_Y), actor.pos.y)
            # - !south (north): Y should decrement toward destination. This inverts the logic for 'south'
            - IF d.south:
                SET TARGET_Y: max(min(TARGET_Y, RECT_Y), actor.pos.y)
              ELSE :
                SET TARGET_Y: min(max(TARGET_Y, RECT_Y), actor.pos.y)
            - RETURN: ( d, true,  try_reserve_point(anchor_h_id , diagonal_id), (RECT_X, TARGET_Y)  )
        - IF anchor_v:
            RETURN: ( d, true,  try_reserve_point(anchor_v_id , diagonal_id) , to_pos(diagonal_id) )
      ELSE:
        - SET yDiff: DEST_POS.y - actor.pos.y
        - IF AND( anchor_v, yDiff != 0):
          - SET SLOPE:  (DEST_POS.x - actor.pos.x) / yDiff                              # line equation, please validate correctness
          - SET TARGET_X: SLOPE * (RECT_Y - actor.pos.y) + actor.pos.x                  # line equation, please validate correctness
          - IF d.east:
              SET TARGET_X: min(max(TARGET_X, RECT_X), actor.pos.x)
            ELSE :
              SET TARGET_X: max(min(TARGET_X, RECT_X), actor.pos.x)
          - RETURN: ( d, true,  try_reserve_point(anchor_v_id , diagonal_id), (TARGET_X, RECT_Y)  )
        - IF anchor_h:
            RETURN: ( d, true,  try_reserve_point(anchor_h_id , diagonal_id) , to_pos(diagonal_id) )
      # at this point, nothing passed
      RETURN: ( d, false,  false , (0,0) )

# proc-ai has to be implemented by AI agent based on provided information
proc-ai:
  distance_to_target:
    x:float: abs(actor.dir.target.x - actor.pos.x)
    y:float: abs(actor.dir.target.y - actor.pos.y)
  distance_to_point(f2 point):
    x:float: abs(point.x - actor.pos.x)
    y:float: abs(point.y - actor.pos.y)
  move_to_target:
    - based on delta-time, calculate STEP as euclidean increment to actor.pos towards actor.dir.target
    - increment actor.pos by STEP
    - if STEP overshoots the destination, clamp the new position exactly to actor.dir.target

  # the following 2 are
  can_reserve_point( int  pointId):
    - inquire grid about the point at the id
    - grid should store reservation information bound by point IDs
    - RETURN:
        false: if the inquired point is already reserved by another actor
        true: if the inquired point is not reserved or reserved by the inquiring actor
  try_reserve_point(int  pointId ):
    - IF can_reserve_point(pointId):
        - mark the point as reserved  by this actor
        - actor.reserved_point = pointId
        - RETURN: true
    - RETURN: false
  try_reserve_point(int  pointId , int anchor ):
    - IF  AND(can_reserve_point(pointId) , can_reserve_point(anchor)):
        - mark both points as reserved  by this actor
        - actor.reserved_point = pointId
        - actor.reserved_anchor = anchor
        - if either reservation fails , the other must be reverted
        - RETURN: true
    - RETURN: false
  release_reserved(vararg int  pointId):             # 'vararg int'  means that multiple 'int' can be passed as parameter.
    - ensure that each  point ID is open for reservation from the grid's perspective
    - if a point ID < 0 , ignore (it is invalid)


  grid_columns:int : returns number of column in the grid
  grid_cell_width:float : returns a grid cell width, as displayed in the GUI
  grid_cell_height:float : returns a grid cell height, as displayed in the GUI
  wait_frames(int frames): do not run the update logic for the actor for <frames> frames

