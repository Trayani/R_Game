
# CONFIG
# CFG_PP_RELEASE: float  # range 0..1  , default: 0.6

# GLOBAL
global:
  constants:
    grid_columns: int
    grid_cell_width: float
    grid_cell_height: float
    CFG_PP_RELEASE: float
  parameters:
    delta_time: float

## STATES
MOVE:
  - DO: move_to_target
  - SET NDT: distance_to_target
  - SET PD: distance_to_point_pos(actor.pos)
  - PROC:switch_pp:
      # Release the old/current primary point before switching
      DO: release_reserved(actor.ppId)

      # Choose the best reserved point to switch to
      SET NEXT: actor.reserved_point
      IF NEXT < 0:
        SET NEXT: actor.reserved_anchor
        IF NEXT < 0:
          PANIC: "switch_pp called with no valid reservations"

      # If both reserved points are valid, choose the one closer to destination
      IF (actor.reserved_anchor >=0) && (distance_to_point_sqr(actor.reserved_point) > distance_to_point_sqr(actor.reserved_anchor)):
        SET NEXT: actor.reserved_anchor
        SET actor.reserved_anchor: -1     # -1 means 'invalid'
      ELSE:
        SET actor.reserved_point: -1      # -1 means 'invalid'

      # Update actor's primary point to the new reserved point
      SET actor.pp_switched: true
      # NEXT is always valid (>=0)
      SET actor.ppId: NEXT
      SET actor.pp: to_point(NEXT)

    # PP switch
    # TOTAL can NEVER be zero during MOVE state, because actor.pos cannot equal
    # both actor.pp (primary point) AND actor.dir.target simultaneously
  - SET TOTAL: PD.x + NDT.x  + PD.y + NDT.y
  - IF !actor.pp_switched:
      # if CFG_PP_RELEASE=0.6, then PP switch happens after 60% of the distance was walked
      # Note: switch_pp is only called when reservation has already succeeded (optimal_direction returned set=true)
      # Therefore, reservation failure after pp_switched should never occur
      - IF (PD.x + PD.y) / TOTAL > CFG_PP_RELEASE:
          DO: switch_pp

  # If we've switched pp and have no more reservations, go back to IDLE to re-plan
  - IF AND(actor.pp_switched, actor.reserved_point < 0, actor.reserved_anchor < 0):
      - SET state: IDLE

  # Target reached - transition to IDLE
  # pp_switched toggles only once per MOVE cycle (set in switch_pp, reset in IDLE)
  - IF AND(NDT.x < 0.5 ,  NDT.y < 0.5):
      - IF !actor.pp_switched:
          DO: switch_pp
      - DO: release_reserved_both(actor.reserved_point,  actor.reserved_anchor)
      - SET state: IDLE


IDLE:
  # Wait for valid destination - actor remains in IDLE checking each frame until valid destination is set externally
  - IF actor.dest.x < 0  || actor.dest.y < 0: PASS                # PASS means terminate early
  - SET d: opt_dir
  - SET actor.dir: optimal_direction(d)
  - IF !actor.dir.set:
      IF d.cardinality == V:
        alternative_direction( DT(N, d.south, false), DT(N, d.south, true))
      ELSE IF d.cardinality == H:
        alternative_direction( DT(N, false,  d.east), DT(N, true,  d.east))
      ELSE:
        alternative_direction( DT(V, d.south,  false), DT(H, false,  d.east))
  - IF actor.dir.set:
      - SET actor.pp_switched: false  # Reset pp_switched flag for new MOVE cycle
      - SET state: MOVE
    ELSE:
      # No valid direction found - wait and retry (actor stays in IDLE)
      # This should happen when all paths are blocked
      DO: wait_frames(3)

## TYPES
DirectionTypeCardinality: H | V | N   # horizontal | vertical | none

DirectionType:
  fields:
    cardinality: DirectionTypeCardinality
    south: bool
    east: bool
  const:
    - NORTH(V, false, false)
    - SOUTH(V, true, false)
    - EAST(H, false, true)
    - WEST(H, false, false)
    - NORTH_WEST(N, false, false)
    - NORTH_EAST(N, false, true)
    - SOUTH_WEST(N, true, false)
    - SOUTH_EAST(N, true, true)
  alias: DT

f2: float x, float y
f2n: float x, float y, bool set
i2: int x, int y
i2n: int x, int y, bool set
Direction: DT type, bool direct, bool set, f2 target

Actor:
  id: uint    # unique identifier for this actor
  pos: f2     # float-precise position of the actor in the grid
  pp: i2n     # primary point (also called subPoint) that denotes the actor's normalized position (for the purpose of path finding and crowd control)
  ppId: int32 # ID of the primary point, calculated as  pp.x + pp.y * grid_columns
  dest: i2   # int-point of the destination that the actor should move to
  dir: Direction  # categorization of the actor's direction of motion
  speed: float   # motion speed
  reserved_point: int = -1  # ID of a reserved point, that the actor is approaching
  reserved_anchor: int = -1  #  ID of a secondary reserved point
  pp_switched: bool = false

Grid:
  grid_points: map(uint, uint)  # map from point ID to actor ID (which actor has reserved this point)




## PROCEDURES
proc:
  opt_dir:DirectionType:
    - SET south: actor.pp.y < actor.dest.y
    - IF actor.pp.x == actor.dest.x:
        RETURN: (V, south, false)
    - SET east: actor.pp.x < actor.dest.x
    - IF actor.pp.y == actor.dest.y:
        RETURN: (H, false, east)
    - RETURN: (N, south, east)

  # Helper: conditional value selection (replaces inline if-else expressions)
  if_else(bool condition, int true_value, int false_value):int:
    - SET result: true_value
    - IF !condition:
        SET result: false_value
    - RETURN: result

  to_pos(int pointId):f2:
    SET y: pointId / grid_columns     #(this should round down to integer)
    RETURN: ((pointId - y*grid_columns)*grid_cell_width, y*grid_cell_height)
  to_pos2(int2 point):f2:
    RETURN: (point.x*grid_cell_width, point.y*grid_cell_height)
  to_point(int pointId):i2n:
    SET y: pointId / grid_columns     #(this should round down to integer)
    RETURN: ((pointId - y*grid_columns), y, true)


  # Type constructor for DirectionType - returns a tuple that gets converted to DirectionType
  DT(str cardinality, bool south, bool east):DirectionType:
    RETURN: (cardinality, south, east)

  alternative_direction(DT a, DT b):
    - SET actor.dir: optimal_direction(a)
    - IF !actor.dir.set:
        - SET actor.dir: optimal_direction(b)

  optimal_direction(DT d):Direction:
    - SET h_offset: if_else(d.east, 1, -1)
    - SET v_offset: if_else(d.south, 1, -1)
    - SET anchor_h_id: actor.ppId + h_offset
    - SET anchor_v_id: actor.ppId + v_offset*grid_columns
    - IF d.cardinality == V:
        RETURN:  ( d, false, try_reserve_point( anchor_v_id), to_pos(anchor_v_id) )

    - IF d.cardinality == H:
        RETURN: ( d, false, try_reserve_point( anchor_h_id), to_pos(anchor_h_id))

    - SET diagonal_id: actor.ppId + h_offset + v_offset*grid_columns
    - SET diagonal: can_reserve_point(diagonal_id)
    - IF !diagonal:
        RETURN: ( d, false,  false, (0,0) )         #  'default'  is the "zero" state (false/zero/null values)
    - SET anchor_h: can_reserve_point( anchor_h_id)
    - SET anchor_v: can_reserve_point( anchor_v_id)
    - IF AND(!anchor_h , !anchor_v):
        RETURN: ( d, false,  false, (0,0) )
    - SET affinity_h: abs(actor.dest.x - actor.pp.x) > abs(actor.dest.y - actor.pp.y)
    - SET DEST_POS: to_pos2(actor.dest)
    - SET RECT_X: (actor.pp.x+h_offset) * grid_cell_width
    - SET RECT_Y: (actor.pp.y+v_offset) * grid_cell_height
    - IF affinity_h:
        - SET xDiff: DEST_POS.x - actor.pos.x
        - IF AND( anchor_h, xDiff != 0):
            - SET SLOPE:  (DEST_POS.y - actor.pos.y) / xDiff         # line equation, please validate correctness
            - SET TARGET_Y: SLOPE * (RECT_X - actor.pos.x) + actor.pos.y
            # RECT_X and RECT_Y  are float coordinates of a rectangle edge that is diagonally opposite to the actor's POINT-based position (actor.pp)
            # The rectangle forms an area of possible movement. Since the horizontal direction is stronger than
            # vertical, we already know, that the actor must travel to the vertical boundary at RECT_X.
            # But Y must be calculated by line equation based on actor's actual position (actor.pos).
            # That can lead to edge cases, where the projected Y is outside the rectangle.
            # Thus, we have to clamp it: if the vertical direction is
            # - south: Y should increment toward destination, so we clamp:
            #   - Lower bound: actor.pos.y (cannot move backward/north)
            #   - Upper bound: RECT_Y (cannot aim beyond rectangle)
            #   - Formula: max(min(TARGET_Y, RECT_Y), actor.pos.y)
            # - !south (north): Y should decrement toward destination. This inverts the logic for 'south'
            - IF d.south:
                SET TARGET_Y: max(min(TARGET_Y, RECT_Y), actor.pos.y)
              ELSE :
                SET TARGET_Y: min(max(TARGET_Y, RECT_Y), actor.pos.y)
            - RETURN: ( d, true,  try_reserve_point_with_anchor(anchor_h_id , diagonal_id), (RECT_X, TARGET_Y)  )
        - IF anchor_v:
            - RETURN: ( d, true,  try_reserve_point_with_anchor(anchor_v_id , diagonal_id) , to_pos(diagonal_id) )
      ELSE:
        - SET yDiff: DEST_POS.y - actor.pos.y
        - IF AND( anchor_v, yDiff != 0):
            - SET SLOPE:  (DEST_POS.x - actor.pos.x) / yDiff                              # line equation, please validate correctness
            - SET TARGET_X: SLOPE * (RECT_Y - actor.pos.y) + actor.pos.x                  # line equation, please validate correctness
            - IF d.east:
                SET TARGET_X: max(min(TARGET_X, RECT_X), actor.pos.x)
              ELSE :
                SET TARGET_X: min(max(TARGET_X, RECT_X), actor.pos.x)
            - RETURN: ( d, true,  try_reserve_point_with_anchor(anchor_v_id , diagonal_id), (TARGET_X, RECT_Y)  )
        - IF anchor_h:
            - RETURN: ( d, true,  try_reserve_point_with_anchor(anchor_h_id , diagonal_id) , to_pos(diagonal_id) )
      # at this point, nothing passed
      RETURN: ( d, false,  false , (0,0) )

  # Distance calculations - converted to DSL (previously in proc-ai)
  distance_to_target:f2:
    - SET x: abs(actor.dir.target.x - actor.pos.x)
    - SET y: abs(actor.dir.target.y - actor.pos.y)
    - RETURN: (x, y)

  distance_to_point_pos(f2 point):f2:
    - SET px: point.x * grid_cell_width
    - SET py: point.y * grid_cell_height
    - SET x: abs(px - actor.pos.x)
    - SET y: abs(py - actor.pos.y)
    - RETURN: (x, y)

  distance_to_point(int pointId):f2:
    - SET point: to_point(pointId)
    - SET px: point.x * grid_cell_width
    - SET py: point.y * grid_cell_height
    - SET x: abs(px - actor.pos.x)
    - SET y: abs(py - actor.pos.y)
    - RETURN: (x, y)

  distance_to_point_sqr(int pointId):float:
    - SET point: to_point(pointId)
    - SET px: point.x * grid_cell_width
    - SET py: point.y * grid_cell_height
    - SET dx: px - actor.pos.x
    - SET dy: py - actor.pos.y
    - RETURN: dx * dx + dy * dy

  # Movement - converted to DSL (previously in proc-ai)
  move_to_target:
    # Calculate direction vector to target
    - SET dx: actor.dir.target.x - actor.pos.x
    - SET dy: actor.dir.target.y - actor.pos.y

    # Calculate Euclidean distance
    - SET L: sqrt(dx*dx + dy*dy)

    # Early exit if already at target (within 0.001 pixels)
    - IF L < 0.001: RETURN

    # Calculate step size: speed * delta_time, clamped to remaining distance
    - SET movement: min(actor.speed * delta_time, L)

    # Calculate normalized step (direction * distance)
    - SET x_step: movement * dx / L
    - SET y_step: movement * dy / L

    # Update actor position
    - SET actor.pos.x: actor.pos.x + x_step
    - SET actor.pos.y: actor.pos.y + y_step

  # Map helper functions
  get(map m, uint key, uint fallback):uint:
    - SET result: fallback
    - IF key in m:
        SET result: m[key]
    - RETURN: result

  remove(map m, uint key):
    - IF key in m:
        SET m[key]: 0  # Remove by setting to 0 (or implement proper removal if supported)

  # Grid/Reservation functions - now implemented in DSL using Grid.grid_points map
  can_reserve_point(uint pointId):bool:
    - SET result: false
    - IF !(pointId in grid.grid_points):
        SET result: true  # Not reserved, can reserve
    - IF pointId in grid.grid_points:
        SET owner: get(grid.grid_points, pointId, 0)
        IF owner == 0:
          SET result: true  # Released (owner=0), can reserve
        IF owner == actor.id:
          SET result: true  # Already reserved by this actor
    - RETURN: result


  try_reserve_point(uint pointId):bool:
    - SET result: false
    - IF can_reserve_point(pointId):
        - SET grid.grid_points[pointId]: actor.id
        - SET actor.reserved_point: pointId
        - SET result: true
    - RETURN: result

  try_reserve_point_with_anchor(uint pointId, uint anchor):bool:
    # Atomic reservation: check both points can be reserved BEFORE reserving either
    - SET result: false
    - IF AND(can_reserve_point(pointId), can_reserve_point(anchor)):
        - SET grid.grid_points[pointId]: actor.id
        - SET grid.grid_points[anchor]: actor.id
        - SET actor.reserved_point: pointId
        - SET actor.reserved_anchor: anchor
        - SET result: true
    - RETURN: result

  release_reserved(uint pointId):
    - IF pointId >= 0:
        IF pointId in grid.grid_points:
          SET grid.grid_points[pointId]: 0

  release_reserved_both(uint pointId1, uint pointId2):
    - IF pointId1 >= 0:
        IF pointId1 in grid.grid_points:
          SET grid.grid_points[pointId1]: 0
    - IF pointId2 >= 0:
        IF pointId2 in grid.grid_points:
          SET grid.grid_points[pointId2]: 0

# proc-ai has to be implemented by AI agent based on provided information
proc-ai:
  # Math functions - standard mathematical operations
  sqrt(float x):float: Returns the square root of x. Implemented natively for performance.
  min(float a, float b):float: Returns the minimum of two float values (a or b, whichever is smaller).
  max(float a, float b):float: Returns the maximum of two float values (a or b, whichever is larger).
  abs(float x):float: Returns the absolute value of x (removes negative sign if present).
  pow(float x):float: Returns x*x
  # Timing function - frame-based delay
  wait_frames(int frames): Pauses actor update logic for the specified number of frames. Actor remains in current state but does not execute update logic during the wait period.

