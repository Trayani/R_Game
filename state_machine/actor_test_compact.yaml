version: "1.0"
config:
  pp_release_threshold: 0.6

states:
  MOVE:
    - do: move_to_target
    - set: {NDT: "distance_to_target()"}
    - set: {PD: "distance_to_point(actor.pos)"}

    - if: "AND(NDT.x < 0.5, NDT.y < 0.5)"
      then:
        - do: switch_pp
        - do: release_reserved
        - set_state: IDLE

  IDLE:
    - if: "actor.dest.x < 0 OR actor.dest.y < 0"
      then:
        - pass: true

    - set: {d: "opt_dir()"}
    - set: {actor.dir: "optimal_direction(d)"}

    - if: "actor.dir.set"
      then:
        - set: {actor.pp_switched: "false"}
        - set_state: MOVE
      else:
        - do: "wait_frames(3)"

procedures:
  native:
    - move_to_target
    - distance_to_target
    - distance_to_point
    - switch_pp
    - release_reserved
    - opt_dir
    - optimal_direction
    - wait_frames

types: {}
